[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-se-bench"
version = "0.1.0"
description = "Evaluation framework for benchmarking LLMs on software engineering tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Gia Bach Vo" },
]
keywords = ["llm", "benchmark", "software-engineering", "evaluation", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LLM provider SDKs
    "anthropic>=0.25",
    "openai>=1.20",
    "google-generativeai>=0.5",
    # Data validation
    "pydantic>=2.0",
    # Templating
    "jinja2>=3.1",
    # CLI
    "click>=8.1",
    # YAML config
    "pyyaml>=6.0",
    # Statistical analysis
    "scipy>=1.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-posthocs>=0.9",
    # Visualisation
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Dashboard
    "plotly>=5.20",
    "dash>=2.16",
    "dash-bootstrap-components>=1.5",
    # Reporting
    "weasyprint>=61",
    # Java AST parsing
    "javalang>=0.13",
    # Docker SDK (sandbox)
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]
# MCP servers. Optional because the harness and the CLI work without them;
# only `llm-se-bench-mcp` needs the SDK. Supports both the 1.x (FastMCP)
# and 2.x (MCPServer) SDK APIs — see mcp_servers/_compat.py.
mcp = [
    "mcp>=1.2",
]

[project.scripts]
llm-se-bench = "cli:main"
llm-se-bench-mcp = "mcp_servers.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "contracts*",
    "settings*",
    "llm_gateway*",
    "bench*",
    "quality*",
    "stats*",
    "framework*",
    "mcp_servers*",
    "agent*",
]

[tool.setuptools.package-data]
"llm_gateway" = ["templates/*.j2"]
"framework" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = [
    "llm_gateway/tests",
    "bench/tests",
    "quality/tests",
    "stats/tests",
    "framework/tests",
    "mcp_servers/tests",
    "agent/tests",
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = [
    "contracts",
    "settings",
    "llm_gateway",
    "bench",
    "quality",
    "stats",
    "framework",
    "mcp_servers",
    "agent",
]
omit = ["*/tests/*", "*/conftest.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Ad-hoc inspection scripts: they manipulate sys.path and load .env before
# importing the package, so their imports cannot come first.
"_check_*.py" = ["E402"]
"_show_*.py" = ["E402"]
# Availability guards: `try: import dash / except ImportError:` establishes
# whether an optional dependency is present. The name is unused on purpose.
"framework/dashboard/pages/*.py" = ["F401"]
"framework/cli_report.py" = ["F401"]
"framework/exporters.py" = ["F401"]
# An unused binding in a test is usually "call this and assert it does not
# raise", which is a legitimate thing to test.
"**/tests/**" = ["F841"]
"tests/**" = ["F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
