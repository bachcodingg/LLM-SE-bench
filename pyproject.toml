[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-se-bench"
version = "0.1.0"
description = "Evaluation framework for benchmarking LLMs on software engineering tasks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "llm-se-bench contributors" },
]
keywords = ["llm", "benchmark", "software-engineering", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LLM provider SDKs
    "anthropic>=0.25",
    "openai>=1.20",
    "google-generativeai>=0.5",
    # Data validation
    "pydantic>=2.0",
    # Templating
    "jinja2>=3.1",
    # CLI
    "click>=8.1",
    # YAML config
    "pyyaml>=6.0",
    # Statistical analysis
    "scipy>=1.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-posthocs>=0.9",
    # Visualisation
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Dashboard
    "plotly>=5.20",
    "dash>=2.16",
    "dash-bootstrap-components>=1.5",
    # Reporting
    "weasyprint>=61",
    # Java AST parsing
    "javalang>=0.13",
    # Docker SDK (sandbox)
    "docker>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage[toml]>=7.4",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]

[project.scripts]
llm-se-bench = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "contracts*",
    "llm_gateway*",
    "bench*",
    "quality*",
    "stats*",
    "framework*",
]

[tool.setuptools.package-data]
"llm_gateway" = ["templates/*.j2"]
"framework" = ["profiles/*.yaml"]

[tool.pytest.ini_options]
testpaths = [
    "llm_gateway/tests",
    "bench/tests",
    "quality/tests",
    "stats/tests",
    "framework/tests",
    "tests",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--tb=short -q"

[tool.coverage.run]
source = [
    "contracts",
    "llm_gateway",
    "bench",
    "quality",
    "stats",
    "framework",
]
omit = ["*/tests/*", "*/conftest.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false
